services:
  postgres:
    image: postgres:16
    container_name: cio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cio_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DevOnlyPassword123!
    ports:
      - "5432:5432"
    volumes:
      - cio-postgres-data:/var/lib/postgresql/data

volumes:
  cio-postgres-data:
